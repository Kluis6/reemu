name: Fumaça do catálogo

# Baixa cada core do catálogo (crates/core-catalog/src/catalog.rs)
# do buildbot, pelo mesmo `download` do app, e:
# - fase 1: abre com `reemu-core-host --probe` (retro_init + system info,
#   sem jogo) num processo à parte;
# - fase 2: nos sistemas de cartucho (NES, SNES, GB, GBA, Mega Drive, Master
#   System, PC Engine, Atari 2600), carrega uma ROM mínima gerada pelo
#   próprio teste (smoke_roms.rs) com `--run` e roda 180 quadros.
# Pega core que sumiu do buildbot, que não abre na plataforma, que cai no
# retro_init ou que não roda um jogo. Também confere a tabela do aviso de
# atualização (updates.rs): repositório fora do ar ou core que deixou de
# declarar o commit fazem o job falhar. A tabela sai no resumo do job.
# Semanal — os nightlies do buildbot mudam sozinhos.

on:
  schedule:
    - cron: "0 6 * * 1" # segunda, 06:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Só estes cores (ids separados por vírgula; vazio = todos)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Catálogo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxkbcommon-dev libudev-dev \
            libasound2-dev mesa-vulkan-drivers libegl1 libgl1 gcc g++

      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: catalog-smoke

      # A fumaça mora na crate `core-catalog` (Fase 6), que não compila o app:
      # não precisa do frontend.
      - name: Compilar o core-host
        run: cargo build -p core-host-desktop

      - name: Baixar e abrir cada core
        shell: bash
        env:
          REEMU_SMOKE_ONLY: ${{ inputs.only }}
        run: |
          # vazio = catálogo inteiro
          [ -z "$REEMU_SMOKE_ONLY" ] && unset REEMU_SMOKE_ONLY
          cargo test -p core-catalog --lib catalog_smoke -- --ignored --nocapture
