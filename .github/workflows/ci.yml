name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Tauri + winit/wgpu + gilrs + glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev \
            mesa-vulkan-drivers \
            gcc \
            g++

      # O canal/componentes vêm de rust-toolchain.toml.
      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  windows-check:
    name: Windows (cargo check cruzado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mesmas deps do job `rust`: os build scripts de host (tauri-build,
      # webkit via pkg-config…) ainda rodam no Linux.
      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxkbcommon-dev libudev-dev \
            libasound2-dev gcc g++

      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      # Só checa o Rust (compilador C falso pros build scripts) — pega
      # código atrás de `cfg(unix)` faltando antes do release no Windows.
      - name: cargo check (x86_64-pc-windows-gnu)
        run: scripts/check-windows.sh

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm --filter app-desktop lint

      - name: test
        run: pnpm --filter app-desktop test

      - name: build
        run: pnpm --filter app-desktop build
