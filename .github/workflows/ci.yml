name: CI

on:
  push:
    branches: [main]
  pull_request:

# Código de pull request roda só com leitura e sem os segredos do projeto.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências de sistema (Tauri + winit/wgpu + gilrs + glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev \
            mesa-vulkan-drivers \
            gcc \
            g++

      # O canal/componentes vêm de rust-toolchain.toml.
      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # `cargo test` regenera os tipos do frontend; o que mudou tem que estar no commit.
      - name: tipos do frontend em dia
        run: |
          git add -N packages/app-desktop/src/lib/bindings
          git diff --exit-code -- packages/app-desktop/src/lib/bindings

  audit:
    name: Rust (cargo audit)
    runs-on: ubuntu-24.04
    # A action publica o resultado como "check run" do commit: precisa de
    # `checks: write` (o padrão do workflow é só `contents: read`).
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # Consulta o banco RustSec contra o Cargo.lock (sem compilar nada). Os
      # IDs ignorados têm motivo registrado no TASKS.md ("cargo audit"):
      # - RUSTSEC-2026-0367/0368/0369/0429: `zip` 4.6.1 só do
      #   `tauri-plugin-updater`, que confere a assinatura antes de abrir o
      #   zip; a 2.14.1 prende o `windows` 0.61 e quebra o build no Windows;
      # - RUSTSEC-2026-0459: `libsqlite3-sys` 0.30 (SQLite em C) — nem o sqlx
      #   0.9 aceita a 0.39 corrigida; esperar o sqlx;
      # - RUSTSEC-2023-0071: `rsa` só está no lock como dependência opcional
      #   do driver MySQL do sqlx, que o ReEmu não compila (só o SQLite).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369,RUSTSEC-2026-0429,RUSTSEC-2026-0459,RUSTSEC-2023-0071

  windows-check:
    name: Windows (cargo check cruzado)
    runs-on: ubuntu-24.04
    # o apt-get do runner já travou por mais de uma hora (run 42245969623)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Mesmas deps do job `rust`: os build scripts de host (tauri-build,
      # webkit via pkg-config…) ainda rodam no Linux.
      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxkbcommon-dev libudev-dev \
            libasound2-dev gcc g++

      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-check

      # Só checa o Rust (compilador C falso pros build scripts) — pega
      # código atrás de `cfg(unix)` faltando antes do release no Windows.
      - name: cargo check (x86_64-pc-windows-gnu)
        run: scripts/check-windows.sh

  # Executa os testes no Windows de verdade (o job acima só confere se compila).
  # Sem GPU: os testes que precisam dela ficam em `#[ignore]` e rodam à mão.
  windows-tests:
    name: Windows (testes)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-tests

      # O crate do app embute o frontend (`frontendDist`) ao compilar.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter app-desktop build

      - name: test
        run: cargo test --workspace

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm --filter app-desktop lint

      - name: test
        run: pnpm --filter app-desktop test

      - name: build
        run: pnpm --filter app-desktop build
