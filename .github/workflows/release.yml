name: Release

# Dispara só em tags de versão (ex: v0.1.0) — sem build nightly na main.
# Empacota o app desktop (Linux .deb/.AppImage + Windows .msi/.exe) e sobe
# os artefatos como uma Release DRAFT no GitHub (revise e publique manual).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Linux — Tauri + wgpu/gilrs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev \
            mesa-vulkan-drivers \
            gcc \
            g++

      # O canal/componentes vêm de rust-toolchain.toml (mesmo padrão do ci.yml).
      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # `reemu-core-host` (crates/core-host-desktop) NÃO é dependência de
      # apps/desktop/src-tauri — `cargo tauri build` sozinho nunca o
      # compila. Precisa existir em target/release/ ANTES do bundle: é isso
      # que tauri.linux.conf.json / tauri.windows.conf.json (bundle.resources)
      # embutem no pacote final, ao lado do executável principal. Mesmo
      # motivo do scripts/dev.sh no modo dev (ver memória
      # reemu-core-host-stale-binary) — sem isto o app empacotado sai
      # instalável, mas quebrado: falha ao carregar qualquer jogo.
      - name: Build reemu-core-host (release)
        run: cargo build --release -p core-host-desktop

      - name: Build + empacotar o app desktop
        run: cargo tauri build --config apps/desktop/src-tauri/tauri.conf.json

      - name: Publicar artefatos na Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
