name: Release

# Dispara em tags de versão (ex: v0.1.0) — sem build nightly na main — E cria
# uma Release DRAFT no GitHub com os artefatos (revise e publique manual).
# `workflow_dispatch` é só pra VALIDAR o build sob demanda (ex: testar o
# Windows sem máquina real disponível) — não cria Release, só sobe os
# artefatos como workflow artifact temporário (ver step abaixo).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Linux — Tauri + wgpu/gilrs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev \
            mesa-vulkan-drivers \
            gcc \
            g++

      # O canal/componentes vêm de rust-toolchain.toml (mesmo padrão do ci.yml).
      - name: Preparar toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # `reemu-core-host` (crates/core-host-desktop) NÃO é dependência de
      # apps/desktop/src-tauri — `cargo tauri build` sozinho nunca o
      # compila. Precisa existir em target/release/ ANTES do bundle: é isso
      # que tauri.bundle.linux.json / tauri.bundle.windows.json (bundle.resources)
      # embutem no pacote final, ao lado do executável principal. Mesmo
      # motivo do scripts/dev.sh no modo dev (ver memória
      # reemu-core-host-stale-binary) — sem isto o app empacotado sai
      # instalável, mas quebrado: falha ao carregar qualquer jogo.
      - name: Build reemu-core-host (release)
        run: cargo build --release -p core-host-desktop

      # `bundle.resources` (o reemu-core-host release) + targets de pacote
      # ficam em tauri.bundle.<os>.json, passados SÓ aqui — não nos nomes
      # tauri.<os>.conf.json que o Tauri mescla sozinho, porque o build.rs do
      # tauri exige que todo resource exista até no `cargo tauri dev`, que não
      # tem (nem precisa de) um build release do core-host.
      - name: Build + empacotar o app desktop (Linux)
        if: runner.os == 'Linux'
        run: cargo tauri build --config apps/desktop/src-tauri/tauri.conf.json --config apps/desktop/src-tauri/tauri.bundle.linux.json

      - name: Build + empacotar o app desktop (Windows)
        if: runner.os == 'Windows'
        run: cargo tauri build --config apps/desktop/src-tauri/tauri.conf.json --config apps/desktop/src-tauri/tauri.bundle.windows.json

      - name: Publicar artefatos na Release (draft) — só em tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir artefatos pra validação (disparo manual) — não é Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
