[package]
name = "core-loader-desktop"
version.workspace = true
edition.workspace = true
description = "Adapter: carrega cores libretro no desktop (libloading)"

[features]
# Expõe `testcore_path()` — o core-fake compilado pelo build.rs. Usado pelos
# testes deste crate e do `emu-session`.
test-fixtures = []

[dependencies]
domain = { path = "../domain" }
libloading = "0.8"
thiserror.workspace = true
async-trait.workspace = true
log = "0.4"
# Caminho GL HW render (etapa 02 passo 4). Mesmas versões que o wgpu 30 já
# resolve — não duplicar. `khronos-egl/dynamic` carrega libEGL em runtime: se
# faltar, só os cores GL falham (com erro claro), os software seguem.
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"
# Tipos FFI Vulkan (`RETRO_HW_RENDER_INTERFACE_VULKAN`, etapa 12) + criação do
# device no processo-filho. Mesma versão que o wgpu 30 já resolve. `loaded`
# carrega libvulkan em runtime: se faltar, só os cores Vulkan-first falham.
ash = { version = "0.38", default-features = false, features = ["loaded"] }
# `libgbm` é aberto via `libloading` (ver dmabuf.rs) — sem link estático, sem
# precisar de `libgbm-dev`; se faltar, o interop cai pro readback.
# ROMs em .zip são extraídas pra um arquivo temporário na hora do load.
zip = { version = "2", default-features = false, features = ["deflate"] }
# .7z — mesma extração, na hora do load (ver library-scan/Cargo.toml).
sevenz-rust2 = { version = "0.22", default-features = false }

[target.'cfg(unix)'.dependencies]
# Só pra `silence_core_stdout` (dup2 do stdout pra /dev/null — cores libretro
# spammam via printf cru fora do log callback) e `dmabuf.rs` (GBM/DRM,
# interop gráfico Linux-only, opt-in via REEMU_GL_INTEROP=1).
rustix = { version = "1", features = ["fs", "stdio", "std"] }

[target.'cfg(windows)'.dependencies]
# Equivalente Windows de `silence_core_stdout`/`with_core_stdout_silenced`
# (`SetStdHandle`/`GetStdHandle`/`DuplicateHandle` no lugar de `dup`/`dup2`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    # contexto OpenGL do HW render no Windows (WGL, `gl_context::wgl`)
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
# Só os testes escrevem `.7z` (fixture) — resolver 2 isola essa feature de
# encoder pro build de teste, o binário de produção não linka LZMA encoder.
sevenz-rust2 = { version = "0.22", default-features = false, features = ["compress"] }
