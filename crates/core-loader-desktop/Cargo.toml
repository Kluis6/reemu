[package]
name = "core-loader-desktop"
version.workspace = true
edition.workspace = true
description = "Adapter: carrega cores libretro no desktop (libloading)"

[features]
# Expõe `testcore_path()` — o core-fake compilado pelo build.rs. Usado pelos
# testes deste crate e do `emu-session`.
test-fixtures = []

[dependencies]
domain = { path = "../domain" }
libloading = "0.8"
thiserror.workspace = true
async-trait.workspace = true
log = "0.4"
# Caminho GL HW render (etapa 02 passo 4). Mesmas versões que o wgpu 30 já
# resolve — não duplicar. `khronos-egl/dynamic` carrega libEGL em runtime: se
# faltar, só os cores GL falham (com erro claro), os software seguem.
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"
# `libgbm` é aberto via `libloading` (ver dmabuf.rs) — sem link estático, sem
# precisar de `libgbm-dev`; se faltar, o interop cai pro readback.
# ROMs em .zip são extraídas pra um arquivo temporário na hora do load.
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
