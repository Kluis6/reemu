[package]
name = "library-scan"
version.workspace = true
edition.workspace = true
description = "Hash de ROMs (CRC32/MD5) + varredura de biblioteca"

[dependencies]
domain = { path = "../domain" }
crc32fast = "1"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
thiserror.workspace = true
log = "0.4"
# ROMs de N64/disco costumam vir em .zip — o scan olha dentro e o loader
# extrai. Só deflate/store (formato dominante); sem bzip2/zstd/aes.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
db = { path = "../db" }
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
