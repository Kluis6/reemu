[package]
name = "video-surface"
version.workspace = true
edition.workspace = true
description = "Renderer wgpu: frame libretro software -> textura -> tela (com letterbox)"

[dependencies]
domain = { path = "../domain" }
wgpu = "30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"

[dev-dependencies]
winit = "0.30"
emu-session = { path = "../emu-session" }
core-loader-desktop = { path = "../core-loader-desktop", features = ["test-fixtures"] }
env_logger = "0.11"
