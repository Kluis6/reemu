<!doctype html>
<meta charset="utf-8" />
<title>ReEmu — gerador dos papéis de parede em vídeo</title>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
  import { SCENES, W, H } from './scenes.js'
  import { muxWebm } from './webm.js'

  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')

  async function scene(id, width, height) {
    canvas.width = width
    canvas.height = height
    if (id === '4') {
      const { createFliperama } = await import('./fliperama.js')
      return createFliperama(width, height)
    }
    const draw = await SCENES[id]()
    return {
      draw(ctx, t) {
        ctx.setTransform(width / W, 0, 0, height / H, 0, 0)
        draw(ctx, t)
      },
    }
  }

  /** Desenha só um quadro (prévia/miniatura). */
  window.frame = async (id, t, width = W, height = H) => {
    const art = await scene(id, width, height)
    try {
      art.draw(ctx, t)
      return canvas.toDataURL('image/jpeg', 0.9)
    } finally {
      art.dispose?.()
    }
  }

  /** Codifica a cena `id` e disponibiliza o WebM para leitura em partes. */
  window.render = async (id, { seconds = 12, fps = 30, bitrate = 2_500_000, keyEvery = 60, codec = 'vp9', quantizer = null, width = W, height = H } = {}) => {
    const art = await scene(id, width, height)
    const total = seconds * fps
    const frames = []
    let error = null
    let description = null
    const enc = new VideoEncoder({
      output: (chunk, meta) => {
        if (meta?.decoderConfig?.description) description = new Uint8Array(meta.decoderConfig.description)
        const data = new Uint8Array(chunk.byteLength)
        chunk.copyTo(data)
        frames.push({ data, timeMs: Math.round(chunk.timestamp / 1000), key: chunk.type === 'key' })
      },
      error: (e) => { error = e },
    })
    // VP9 perfil 0, nível 4.1 (até 1080p60), 8 bits; ou AV1 Main, nível 4.0, 8 bits
    const codecString = codec === 'av1' ? 'av01.0.08M.08' : 'vp09.00.41.08'
    try {
      const rate = quantizer === null ? { bitrate, bitrateMode: 'variable' } : { bitrateMode: 'quantizer' }
      enc.configure({ codec: codecString, width, height, ...rate, framerate: fps, latencyMode: 'quality' })
      for (let i = 0; i < total; i++) {
        art.draw(ctx, i / total)
        const vf = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) })
        const keyFrame = i % keyEvery === 0
        enc.encode(vf, quantizer === null ? { keyFrame } : { keyFrame, vp9: { quantizer } })
        vf.close()
        while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1))
      }
      await enc.flush()
      if (error) throw error
      frames.sort((a, b) => a.timeMs - b.timeMs)
      const bytes = muxWebm({
        width, height, frames, durationMs: seconds * 1000,
        codecId: codec === 'av1' ? 'V_AV1' : 'V_VP9', codecPrivate: codec === 'av1' ? description : null,
      })
      window.__out = bytes
      return bytes.length
    } finally {
      if (enc.state !== 'closed') enc.close()
      art.dispose?.()
    }
  }

  /** Pedaço `i` (de 1 MB) da saída em base64 — o CDP não leva tudo de uma vez. */
  window.chunk = (i) => {
    const part = window.__out.subarray(i * 1048576, (i + 1) * 1048576)
    let s = ''
    for (let k = 0; k < part.length; k += 32768) s += String.fromCharCode(...part.subarray(k, k + 32768))
    return btoa(s)
  }
  window.ready = true
</script>
